version: 2
project_name: repospect
builds:
  - main: ./cmd/repospect
    binary: repospect
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - "-s -w -buildid= -X main.version={{.Version}}"
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, SECURITY.md, docs/*]
checksum:
  name_template: checksums.txt
release:
  draft: true
