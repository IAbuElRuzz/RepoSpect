name: Bug report
description: Report incorrect behavior, false positives or missing coverage.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Do not include real credentials, private source, functional malware or live attack infrastructure. See SECURITY.md for sensitive reports."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the command, RepoSpect version, OS and Go version.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal harmless reproducer
      description: Redact sensitive values and use example.invalid destinations.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant findings or coverage details
      description: Include rule IDs and redacted output where useful.
